---
argument_specs:
  main:
    short_description: Regularly check hosts for configuration drift with ansible-drift
    description:
      - Installs the C(ansible-drift) script and, if C(drift_playbook) is set, a systemd service and timer which run the playbook in check mode against all hosts and report differences.
    options:
      drift_hostlist:
        type: str
        description:
          - Bash compatible list of hosts to check.
        default: "\n  {{ groups['all']|sort|join('\n  ') }}\n"
      drift_receiver:
        type: str
        description:
          - Mail recipient of the drift reports.
        default: root
      drift_user:
        type: str
        description:
          - User under which ansible-drift runs.
        default: ansible
      drift_playbook:
        type: str
        description:
          - Playbook to be executed regularly.
          - The systemd service and timer are only installed if this is set.
      drift_branch:
        type: str
        description:
          - Git branch to pull, for example C(origin master).
        default: ""
      drift_excluded_tags:
        type: str
        description:
          - Comma separated list of tags to skip, for example C(first_tag,second_tag).
        default: ""
      drift_prometheus_dir:
        type: str
        description:
          - Directory where the Prometheus node exporter textfile is written.
        default: /var/lib/prometheus/node-exporter
      drift_prometheus_file:
        type: str
        description:
          - File name of the Prometheus metrics file.
        default: ansible_drift.prom
      drift_ssh_private_key:
        type: str
        description:
          - SSH private key content for the drift user.
          - If unset, no SSH key pair is installed.
      drift_ssh_public_key:
        type: str
        description:
          - SSH public key content for the drift user.
          - Required if C(drift_ssh_private_key) is set.
